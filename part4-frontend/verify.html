<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - AussieEcoLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body class="auth-bg">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <i class="bi bi-envelope-check-fill text-success" style="font-size:2.2rem;"></i>
                <h2 class="brand-title mt-2 mb-0">Verify Email</h2>
                <p class="text-muted mb-0" id="email-hint" style="font-size:0.9rem;">
                    Check your inbox for a verification code.
                </p>
            </div>

            <div id="alert-box"></div>

            <form id="verify-form" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-medium">Verification Code</label>
                    <input type="text" class="form-control text-center fw-bold"
                           id="code" placeholder="123456"
                           maxlength="6" inputmode="numeric"
                           style="letter-spacing: 0.4rem; font-size: 1.4rem;"
                           required>
                </div>
                <button type="submit" class="btn btn-eco w-100" id="verify-btn">
                    Verify
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="#" id="resend-link" class="text-muted" style="font-size:0.85rem;">
                    Didn't receive a code? Resend
                </a>
            </div>
            <div class="text-center mt-2">
                <a href="login.html" class="text-success" style="font-size:0.85rem;">
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    const email = sessionStorage.getItem('pendingVerifyEmail');
    if (!email) {
        window.location.href = 'signup.html';
    } else {
        document.getElementById('email-hint').textContent = `Code sent to ${email}`;
    }

    document.getElementById('verify-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn  = document.getElementById('verify-btn');
        const code = document.getElementById('code').value.trim();

        if (code.length !== 6) {
            return showAlert('warning', 'Please enter the 6-digit code.');
        }

        setLoading(btn, true, 'Verifying...');
        clearAlert();

        try {
            await confirmSignUp(email, code);
            sessionStorage.removeItem('pendingVerifyEmail');
            window.location.href = 'login.html?verified=1';
        } catch (err) {
            showAlert('danger', err.message || 'Verification failed. Please try again.');
            setLoading(btn, false, 'Verify');
        }
    });

    document.getElementById('resend-link').addEventListener('click', async e => {
        e.preventDefault();
        try {
            await resendCode(email);
            showAlert('success', 'Code resent! Please check your inbox.');
        } catch (err) {
            showAlert('danger', err.message || 'Failed to resend code.');
        }
    });

    function showAlert(type, msg) {
        document.getElementById('alert-box').innerHTML =
            `<div class="alert alert-${type} py-2 mb-3">${msg}</div>`;
    }
    function clearAlert() { document.getElementById('alert-box').innerHTML = ''; }
    function setLoading(btn, loading, label) {
        btn.disabled = loading;
        btn.innerHTML = loading
            ? `<span class="spinner-border spinner-border-sm"></span> ${label}`
            : label;
    }
</script>
</body>
</html>
