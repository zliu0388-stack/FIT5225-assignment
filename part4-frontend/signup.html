<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AussieEcoLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body class="auth-bg">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card auth-card shadow-sm" style="max-width:460px;">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <i class="bi bi-binoculars-fill text-success" style="font-size:2.2rem;"></i>
                <h2 class="brand-title mt-2 mb-0">Create Account</h2>
                <p class="brand-sub mb-0">AussieEcoLens</p>
            </div>

            <div id="alert-box"></div>

            <form id="signup-form" novalidate>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-medium">First Name</label>
                        <input type="text" class="form-control" id="firstName"
                               placeholder="Jane" required autocomplete="given-name">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-medium">Last Name</label>
                        <input type="text" class="form-control" id="lastName"
                               placeholder="Smith" required autocomplete="family-name">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" class="form-control" id="email"
                           placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Min. 8 characters" required autocomplete="new-password">
                    <div class="form-text">Must contain uppercase, lowercase, number, and symbol.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Re-enter password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-eco w-100 mt-1" id="signup-btn">
                    Create Account
                </button>
            </form>

            <hr class="my-3">
            <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
                Already have an account?
                <a href="login.html" class="text-success fw-medium">Sign In</a>
            </p>
        </div>
    </div>
</div>

<script src="https://unpkg.com/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    isAuthenticated().then(ok => { if (ok) window.location.href = 'dashboard.html'; });

    document.getElementById('signup-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn         = document.getElementById('signup-btn');
        const firstName   = document.getElementById('firstName').value.trim();
        const lastName    = document.getElementById('lastName').value.trim();
        const email       = document.getElementById('email').value.trim();
        const password    = document.getElementById('password').value;
        const confirmPwd  = document.getElementById('confirmPassword').value;

        if (!firstName || !lastName || !email || !password || !confirmPwd) {
            return showAlert('warning', 'Please fill in all fields.');
        }
        if (password !== confirmPwd) {
            return showAlert('danger', 'Passwords do not match.');
        }

        setLoading(btn, true, 'Creating account...');
        clearAlert();

        try {
            await signUp(email, password, firstName, lastName);
            sessionStorage.setItem('pendingVerifyEmail', email);
            window.location.href = 'verify.html';
        } catch (err) {
            showAlert('danger', err.message || 'Sign up failed. Please try again.');
            setLoading(btn, false, 'Create Account');
        }
    });

    function showAlert(type, msg) {
        document.getElementById('alert-box').innerHTML =
            `<div class="alert alert-${type} py-2 mb-3">${msg}</div>`;
    }
    function clearAlert() { document.getElementById('alert-box').innerHTML = ''; }
    function setLoading(btn, loading, label) {
        btn.disabled = loading;
        btn.innerHTML = loading
            ? `<span class="spinner-border spinner-border-sm"></span> ${label}`
            : label;
    }
</script>
</body>
</html>
